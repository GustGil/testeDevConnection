services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: teste-dev-app

    working_dir: /var/www

    volumes:
      - .:/var/www

    depends_on:
      - db

    networks:
      - app-network

  nginx:
    image: nginx:alpine

    container_name: teste-dev-nginx

    ports:
      - "8000:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - app-network



  db:
    image: postgres:17

    container_name: teste-dev-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: testeDevConnection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - app-network


networks:
  app-network:


volumes:
  postgres-data: